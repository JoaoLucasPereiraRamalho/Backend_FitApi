name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar migrações
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      - name: Publicar o commit no Render
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$DEPLOY_HOOK_URL" in
            *\?*) separator='&' ;;
            *) separator='?' ;;
          esac
          curl --fail --silent --show-error -X POST "${DEPLOY_HOOK_URL}${separator}ref=${COMMIT_SHA}" > /dev/null
      - name: Aguardar /health em homologação
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          # O serviço gratuito pode estar hibernado; a primeira resposta leva cerca de um minuto.
          for attempt in $(seq 1 40); do
            if curl --fail --silent --max-time 30 "${STAGING_API_URL%/}/health"; then
              echo
              exit 0
            fi
            sleep 15
          done
          echo "::error::${STAGING_API_URL%/}/health não respondeu 200 após o deploy."
          exit 1
